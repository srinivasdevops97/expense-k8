apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expense
  labels:
    app: mysql
    tier: db
    project: expense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      tier: api
      project: expense
  template:
    metadata:
      labels:
        app: backend
        tier: api
        project: expense
    spec:
      containers:
      - name: backend
        image: srinivasdevops97/backend:v1
---
# Service
kind: Service
apiVersion: v1
metadata:
  name: expense  # name of the service
spec:
  selector:
    app: backend
    tier: api
    project: expense
  ports:       # list of the ports
  - name: backend-port
    protocol: TCP
    port: 8080   # service port
    targetPort: 8080     # container port(another port)
